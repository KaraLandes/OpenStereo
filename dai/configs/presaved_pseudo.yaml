# Configuration for pseudo-foundationstereo-presaved Mode
# Uses precomputed pseudo-GT disparities stored on disk

seed: 28

datasets:
  - name: irs
    root: ./src_data/IRS
    subsets:
      - Home_1
      - Home_2
      - Office_1
      - Office_2
      - Restaurant
      - Store
    resolution: null  # Native 540x960
    target_source: pseudo-foundationstereo-presaved  # NEW MODE - load presaved pseudo GT
    return_right_disp: false

splitter:
  train:
    enabled: true
    proportion: 0.7
  val:
    enabled: true
    proportion: 0.15
  test:
    enabled: true
    proportion: 0.15
  seed: 42
  strategy: stratified

transforms:
  train:
    - {name: StridedRandomCrop, size: [384, 768], stride: 100}
    - {name: Resize, size: [256, 512]}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  
  val:
    - {name: StridedRandomCrop, size: [384, 768], stride: 100}
    - {name: Resize, size: [256, 512]}
    - {name: RightBottomPad, divisor: 32}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  
  test:
    - {name: StridedRandomCrop, size: [384, 768], stride: 100}
    - {name: Resize, size: [256, 512]}
    - {name: RightBottomPad, divisor: 32}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

dataloader:
  batch_size: 12
  num_workers: 12
  shuffle: true
  pin_memory: true
  drop_last: true
  persistent_workers: false
  prefetch_factor: 1

# Model configuration
model:
  name: LightStereo
  variant: S
  max_disp: 300
  left_att: true
  aggregation_blocks: [1, 2, 4]
  expanse_ratio: 4
  backbone: MobileNetv2
  freeze_backbone: true

# FoundationStereo configuration (for generation script)
foundationstereo:
  model_size: large  # Options: 'small', 'base', 'large'
  inference_batch_size: 24  # Batch size for generating crops (all 25 crops at once on A100)
  inference_iters: 12  # GRU iterations
  inference_amp: true  # Float16 autocast for faster inference

# Training optimization
optimization:
  num_epochs: 90
  executable_epochs: 6
  amp: false
  grad_clip_value: 0.1
  accumulation_steps: 2
  
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.00001
    eps: 0.00000001
  
  scheduler:
    name: OneCycleLR
    pct_start: 0.05
    on_epoch: false

# Loss function configuration
loss:
  loss_weights:
    # Base regression losses (always enabled)
    disp_pred: 1.0        # Final prediction loss (Smooth L1)
    disp_4: 0.3           # Intermediate 1/4 resolution prediction loss
    
    # Extended loss components (0.0 = disabled)
    # Recommended starting point: gradient=0.4, edge_smooth=0.1, second_order_smooth=0.05
    gradient: 0.6        # Gradient matching: sharpens edges, matches GT disparity gradients
    edge_smooth: 0.0      # Edge-aware smoothness: reduces noise in flat regions, preserves boundaries
    second_order_smooth: 0.00  # Second-order smoothness: encourages planar surfaces, straightens long edges

# Training mode
training:
  mode: normal

# Logging configuration
logging:
  wandb:
    project: lightstereo
    entity: null
    run_name: presaved_pseudo_gt_IRS_256X512_with_extended_losses_g6e-1_e0_s0
    group: training_classic_02
    tags: []
  
  log_interval: 10
  save_interval: 1

# Checkpoint saving
checkpoints:
  save_dir: src_data/lightstereo_training/presaved_pseudo_gt
  save_best: true
  save_periodic: true
