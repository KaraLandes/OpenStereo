# DAI Dataset Configuration

seed: 28

datasets:
  - name: sceneflow  # Options: 'sceneflow', 'kitti12'
    root: ./src_data/sceneflow
    subsets:  # Options: 'monkaa', 'driving', 'flyingthings3d', 'flyingthings3d_subset'
      - monkaa
      - driving  # Commented out for faster startup during testing
      - flyingthings3d  # Commented out for faster startup during testing
    pass_type: cleanpass  # Options: 'cleanpass', 'finalpass'
    resolution: null  # [H, W] or null for original
    target_source: provided  # Options: 'provided', 'pseudo-foundationstereo', 'ssl'
    return_right_disp: false
    
  # - name: kitti12
  #   root: ./src_data/kitti12
  #   split: training  # Options: 'training', 'testing'
  #   resolution: [256, 512]
  #   target_source: provided  # Options: 'provided', 'pseudo-foundationstereo', 'ssl'
  #   return_right_disp: false

splitter:
  train:
    enabled: true
    proportion: 0.7
  val:
    enabled: true
    proportion: 0.15
  test:
    enabled: true
    proportion: 0.15
  seed: 42
  strategy: stratified  # Options: 'random', 'sequential', 'stratified'
  # Stratified splitting:
  #   - KITTI12: Simple random/sequential (no stratification)
  #   - SceneFlow Monkaa: Split by scene folder (entire scenes to train/val/test)
  #   - SceneFlow Driving/FlyingThings3D: Sequential split within each video sequence
  
  # Per-dataset overrides (optional)
  # per_dataset:
  #   sceneflow:
  #     train: 0.85
  #     val: 0.15
  #     test: 0.0
  #   kitti12:
  #     train: 0.7
  #     val: 0.3
  #     test: 0.0

transforms: # !! transforms - applied in order !!
  train:
    # - {name: StereoColorJitter, brightness: [0.6, 1.4], contrast: [0.6, 1.4], saturation: [0.6, 1.4], hue: 0.5, asymmetric_prob: 0.2}
    # - {name: RandomErase, prob: 0.5, max_time: 2, bounds: [50, 100]}
    # - {name: RandomScale, min_scale: -0.2, max_scale: 0.4, scale_prob: 0.8}
    
    - {name: RandomCrop, size: [320, 736]}
    - {name: ToTensor}
    # Normalize with ImageNet stats (required)
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  
  val:
    - {name: RightBottomPad, divisor: 32}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  
  test:
    - {name: RightBottomPad, divisor: 32}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

dataloader:
  batch_size: 24  # Optimal for async loading (16 samples × 400ms = 6.4s per batch)
  num_workers: 12  # 8 workers for good parallelism without contention
  shuffle: true  # Shuffle training data (recommended for train)
  pin_memory: true  # Pin memory for faster GPU transfer
  drop_last: true  # Drop last incomplete batch (useful for training)
  persistent_workers: true  # Keep workers alive between epochs
  prefetch_factor: 2  # Each worker prefetches 6 batches (8 × 6 = 48 batches buffered)

# Model configuration
model:
  name: LightStereo  # Model architecture
  variant: S  # Options: 'S', 'M', 'L', 'H' (LightStereo-S is smallest/fastest)
  max_disp: 300  # Maximum disparity value
  left_att: true  # Use left attention mechanism
  aggregation_blocks: [1, 2, 4]  # Number of blocks at each aggregation level
  expanse_ratio: 4  # Channel expansion ratio
  backbone: MobileNetv2  # Backbone architecture
  freeze_backbone: true  # Freeze MobileNet backbone (only train stereo head)

# Training optimization
optimization:
  num_epochs: 90  # Total training epochs (90 for SceneFlow, 500 for KITTI fine-tuning)
  executable_epochs: 90  # Early stopping: number of epochs to actually run (null = run all num_epochs, int = stop after N epochs)
  amp: false  # Use automatic mixed precision (disabled for max_disp=300 stability)
  grad_clip_value: 0.1  # Gradient clipping value (prevents exploding gradients)
  accumulation_steps: 1  # Gradient accumulation: effective_batch_size = batch_size × accumulation_steps
  
  optimizer:
    name: AdamW  # Options: 'AdamW', 'Adam', 'SGD'
    lr: 0.001  # Learning rate (0.0001 * batch_size for LightStereo-S)
    weight_decay: 0.00001  # L2 regularization
    eps: 0.00000001  # Numerical stability epsilon
  
  scheduler:
    name: OneCycleLR  # Options: 'OneCycleLR', 'StepLR', 'CosineAnnealingLR'
    pct_start: 0.05  # Percentage of cycle spent increasing lr (1% warmup)
    on_epoch: false  # Update scheduler per iteration (not per epoch)
    # Note: max_lr is automatically set from optimizer.lr

# Loss function configuration
loss:
  loss_weights:
    disp_pred: 1.0  # Weight for final disparity prediction
    disp_4: 0.3  # Weight for 1/4 resolution intermediate prediction

# Training mode (simple/normal training - no temporal/sequential)
training:
  mode: normal  # Options: 'normal', 'sequential_fused_features', 'sequential_warped_disparity'

# Logging configuration (WandB always enabled)
logging:
  wandb:
    project: lightstereo  # WandB project name
    entity: null  # WandB entity/team (null = personal account)
    run_name: max_disp_300_frozen_backbone_90ep  # Run name (null = auto-generated by WandB)
    group: training_classic_02  # Group name for sweep runs (automatically set by sweep agent)
    tags: []  # Tags for organization
  
  log_interval: 250  # Log metrics every N iterations
  save_interval: 89  # Save checkpoint every N epochs

# Checkpoint saving
checkpoints:
  save_dir: src_data/lightstereo_training/training_classic  # Directory to save checkpoints
  save_best: true  # Save best model based on validation EPE
  save_periodic: false  # Save periodic checkpoints
