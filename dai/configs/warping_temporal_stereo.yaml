# Warping Temporal Stereo Configuration
# Sequential training with disparity warping and optical flow

seed: 28

datasets:
  - name: sceneflow
    root: ./src_data/sceneflow
    subsets:
      - monkaa
      - driving
      - flyingthings3d
    pass_type: cleanpass
    resolution: null
    target_source: pseudo-foundationstereo
    return_right_disp: false
    
    sequential:
      enabled: true
      sequence_length: 6
      stride: 3
      skip_incomplete: true

splitter:
  train:
    enabled: true
    proportion: 0.7
  val:
    enabled: true
    proportion: 0.15
  test:
    enabled: true
    proportion: 0.15
  seed: 28
  strategy: stratified

transforms:
  train:
    - {name: RandomCrop, size: [320, 736]}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  
  val:
    - {name: RightBottomPad, divisor: 32}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  
  test:
    - {name: RightBottomPad, divisor: 32}
    - {name: ToTensor}
    - {name: NormalizeImage, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

dataloader:
  batch_size: 2
  num_workers: 12
  shuffle: true
  pin_memory: true
  drop_last: true
  persistent_workers: true
  prefetch_factor: 12

model:
  name: WarpingLightStereo
  variant: S
  max_disp: 192
  left_att: true
  aggregation_blocks: [1, 2, 4]
  expanse_ratio: 4
  backbone: MobileNetv2
  
  temporal:
    use_motion_hints: true
    flow_max_displacement: 4
    flow_feature_channels: 16

optimization:
  num_epochs: 90
  executable_epochs: 90
  amp: true
  grad_clip_value: 0.15
  accumulation_steps: 1  # Gradient accumulation: effective_batch_size = batch_size × accumulation_steps
  
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.00001
    eps: 0.00000001
  
  scheduler:
    name: OneCycleLR
    pct_start: 0.05
    on_epoch: false

loss:
  loss_weights:
    disp_pred: 1.0
    disp_4: 0.3
    temporal_consistency: 0.1

training:
  mode: sequential_warped_disparity

logging:
  wandb:
    project: lightstereo
    entity: null
    run_name: null
    group: null
    tags: [sceneflow, warping-temporal-lightstereo, disparity-warping]
  
  log_interval: 250
  save_interval: 10

checkpoints:
  save_dir: src_data/warping_temporal_lightstereo_training/testing
  save_best: true
  save_periodic: false
