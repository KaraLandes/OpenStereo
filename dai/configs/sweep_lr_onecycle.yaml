program: main.py
method: bayes
metric:
  name: val/epe
  goal: minimize

parameters:
  optimization.optimizer.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  
  optimization.scheduler.max_lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  
  optimization.scheduler.pct_start:
    values: [0.01, 0.05, 0.1, 0.15, 0.2]
  
  optimization.scheduler.div_factor:
    values: [10.0, 25.0, 50.0, 100.0]
  
  optimization.scheduler.final_div_factor:
    values: [1000.0, 5000.0, 10000.0, 20000.0]
  
  optimization.optimizer.weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.0001

early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
  s: 2

command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/stereo_flow.yaml
  - ${args_no_hyphens}
